<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Đặt lại mật khẩu - IT Device Manager</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #202124; }
    .card { width: min(92vw, 520px); box-sizing: border-box; background: white; border: 1px solid #dadce0; border-radius: 14px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { line-height: 1.55; }
    .button { display: inline-block; border: 0; border-radius: 8px; padding: 12px 18px; background: #6f42c1; color: white; font-weight: 600; text-decoration: none; cursor: pointer; }
    .secondary { margin-left: 8px; background: #eceff1; color: #202124; }
    .status { margin: 16px 0; padding: 12px; border-radius: 8px; background: #f1f3f4; }
    .error { background: #fce8e6; color: #b3261e; }
    code { word-break: break-all; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      .card { background: #292a2d; border-color: #3c4043; }
      .status { background: #3c4043; }
      .error { background: #5c2b29; color: #f2b8b5; }
      .secondary { background: #3c4043; color: #e8eaed; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Đặt lại mật khẩu</h1>
    <p>Trang này sẽ mở ứng dụng <strong>IT Device Manager</strong> để bạn tạo mật khẩu mới.</p>
    <div id="status" class="status">Đang chuẩn bị mở ứng dụng...</div>
    <p>
      <button id="openApp" class="button" type="button">Mở IT Device Manager</button>
      <button id="copyLink" class="button secondary" type="button">Sao chép liên kết</button>
    </p>
    <p style="font-size:13px;color:#777">Nếu trình duyệt hỏi quyền mở ứng dụng, hãy chọn <strong>Open IT Device Manager</strong>.</p>
  </main>

  <script>
    (() => {
      const status = document.getElementById('status');
      const openApp = document.getElementById('openApp');
      const copyLink = document.getElementById('copyLink');
      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      const token = hash.get('token');

      if (!token) {
        status.classList.add('error');
        status.textContent = 'Liên kết không hợp lệ hoặc thiếu token đặt lại mật khẩu.';
        openApp.disabled = true;
        copyLink.disabled = true;
        return;
      }

      const appLink = `itdevicemanager://reset-password?token=${encodeURIComponent(token)}`;

      const launch = () => {
        status.textContent = 'Đang mở IT Device Manager...';
        window.location.href = appLink;
        setTimeout(() => {
          status.textContent = 'Nếu ứng dụng chưa mở, hãy bấm nút "Mở IT Device Manager".';
        }, 1800);
      };

      openApp.addEventListener('click', launch);
      copyLink.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(appLink);
          status.textContent = 'Đã sao chép liên kết ứng dụng.';
        } catch {
          status.textContent = 'Không thể sao chép tự động. Hãy bấm "Mở IT Device Manager".';
        }
      });

      // The email click is already a user gesture. Try immediately, but keep an explicit button
      // because some browsers require one more confirmation before opening a custom URI scheme.
      setTimeout(launch, 350);
    })();
  </script>
</body>
</html>
